<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>日序登录验证码</title></head>
<body style="font-family:system-ui,sans-serif;color:#244f42;background:#fafbf8;padding:24px">
  <h2>日序登录验证码</h2>
  <p>输入以下 6 位验证码，登录或创建你的日序账号：</p>
  <p style="font-size:32px;letter-spacing:8px;font-weight:600">{{ .Token }}</p>
  <p>验证码 10 分钟内有效。请使用最新收到的验证码，勿向他人透露。</p>
  <p>若非本人操作，请忽略这封邮件。</p>
</body></html>

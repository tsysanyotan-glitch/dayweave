name: Check application
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: https://dayweave-test.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dayweave_test_only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-checks
          path: |
            artifacts/*.png
            test-results/
